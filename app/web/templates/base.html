<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}News{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css?v=30" />
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="/static/tts.js" defer></script>
    <script src="/static/topic_filters.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar__inner">
        <a class="brand" href="/ui">
          <img class="brand__logo" src="/logo.png" alt="" aria-hidden="true" />
          <span>Fast Info</span>
        </a>
      </div>
    </header>

    <main class="container">
      {% block content %}{% endblock %}
    </main>

    <footer class="footer">
      <div class="container footer__inner">
        <small>Treści pochodzą z RSS — pełny artykuł jest dostępny na stronie źródłowej.</small>
        <small>Aplikacja ma charakter czysto naukowy, spwardzający możliwości AI.</small>
      </div>
    </footer>
  </body>
</html>
